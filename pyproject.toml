[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-qos-orchestrator"
version = "0.1.0"
description = "A research prototype for agentic, graph-backed QoS remediation."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "google-adk[a2a]==1.39.1",
  "httpx==0.28.1",
  "langchain==1.1.0",
  "langchain-core==1.1.0",
  "langchain-google-genai==3.2.0",
  "langchain-mcp-adapters==0.1.14",
  "langchain-openai==1.1.0",
  "langgraph==1.0.4",
  "langgraph-checkpoint==3.0.1",
  "langgraph-prebuilt==1.0.5",
  "langgraph-sdk==0.2.12",
  "mcp==1.30.0",
  "python-dotenv==1.2.3",
  "typing-extensions==4.16.0",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
email = ["fastmcp==2.14.7"]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["qos_system_lg*", "integrations*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
