name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Compile sources
        run: python -m compileall -q qos_system_lg integrations tests
      - name: Check style
        run: |
          ruff check .
          ruff format --check .
      - name: Run unit tests
        run: python -m pytest
